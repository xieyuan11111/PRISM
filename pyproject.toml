[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-prism"
version = "0.1.0"
description = "Trace policy and academic discourse evolution with auditable evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PRISM contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Graphiti/Neo4j remains opt-in and is NEVER part of the default install;
# PRISM's default runtime stays fully offline without it. Pinned to the
# versions verified in the Phase B live spike (docs/graphiti-spike-plan.md,
# 2026-09-03): graphiti-core 0.29.3 and the neo4j Python driver 6.3.0.
# httpx is listed because graphiti-core 0.29.3 imports httpx unconditionally
# at package import (its LLM client base) yet never declares it in its own
# metadata - it only arrives transitively via graphiti-core's openai
# dependency; 0.28.1 is the version the spike installed and verified. The
# spike's pytest run is deliberately NOT part of this extra.
graphiti = [
    "graphiti-core==0.29.3",
    "neo4j==6.3.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
