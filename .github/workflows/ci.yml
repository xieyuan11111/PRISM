name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest -q
      - name: Run lint
        run: ruff check .

# This workflow must remain offline-only: no real LLM/provider calls, crawlers,
# Graphiti/Neo4j services, PDF renderer, Docker or Docker Compose.
